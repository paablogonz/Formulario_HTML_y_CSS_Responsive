<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>REGISTRO</title>
</head>
<body>
    <form class="formulario">
        <h1>Registro de Usuario</h1>
        <div class="contenedor">
            <div class="input-contendor">
                <img class="icon" src="img/icons8-usuario-80.png" alt="">
                <input type="text" placeholder="Nombre de usuario">
            </div>
            <div class="input-contendor">
                <img class="icon" src="img/icons8-correo-96.png" alt="">
                <input type="mail" placeholder="Correo Electrónico">
            </div>
            <div class="input-contendor">
                <img class="icon" src="img/icons8-contraseña-48.png" alt="">
                <input type="password" placeholder="Contraseña">
            </div>
            <input type="submit" value="Registro" class="button">
            <p>Al registrarse, acepta nuestras condiciones de uso y política de privacidad.</p>
            <p>¿Ya tiene una cuenta?<a class="link" href="index1.html">Iniciar Sesión</a></p>
        </div>
    </form>
</body>
</html>
